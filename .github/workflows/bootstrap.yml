name: Extract project and build APK

on:
  push:
    branches: [ main ]
    paths:
      - "vpnshare-fixed.zip"
      - ".github/workflows/bootstrap.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare-and-build:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract project into repository root
        run: |
          set -euo pipefail
          test -f vpnshare-fixed.zip
          mkdir -p "$RUNNER_TEMP/project"
          unzip -q vpnshare-fixed.zip -d "$RUNNER_TEMP/project"
          if [ -d "$RUNNER_TEMP/project/vpnshare-main" ]; then
            SOURCE="$RUNNER_TEMP/project/vpnshare-main"
          else
            SOURCE="$RUNNER_TEMP/project"
          fi
          rsync -a --delete --exclude='.git/' --exclude='.github/workflows/bootstrap.yml' --exclude='.github/workflows/build.yml' "$SOURCE/" ./
          rm -f vpnshare-fixed.zip
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Extract Android project from uploaded ZIP"
            git push
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Android NDK and SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.2.12479018" "platforms;android-35" "build-tools;35.0.0"

      - name: Fetch tunnel engine
        run: git clone --branch 2.20.0 --depth 1 --recursive https://github.com/heiher/hev-socks5-tunnel app/src/main/jni/hev-socks5-tunnel

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Build release APK when signing secrets are configured
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          KEYSTORE_PATH="$RUNNER_TEMP/release.jks" gradle assembleRelease --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: HotShare-apk
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
